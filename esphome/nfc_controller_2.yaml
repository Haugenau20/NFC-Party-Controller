# NFC Party Controller - ESP32 #2 (With Volume Control)
# Hardware: ESP32 USB-C IoT DevKitC
# Components: PN532 NFC Reader, Buzzer, Volume Potentiometer

substitutions:
  device_name: nfc-party-controller-2
  friendly_name: "NFC Party Controller 2"
  device_description: "ESP32-based NFC controller (With Volume) for multi-room audio and party automation"

esphome:
  name: ${device_name}
  comment: ${device_description}

# Import all common configuration (includes volume potentiometer)
packages:
  common: !include common.yaml

# Physical button specific to ESP32 #2
binary_sensor:
  # Pause/resume button for Device 2 speaker (media_player.spotify_soren_nytar)
  # Users tap NFC tags to play songs/playlists, then press this button to pause playback
  - platform: gpio
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    name: "${friendly_name} Speaker Button"
    id: speaker_button
    filters:
      # Debounce to prevent false triggers from mechanical bouncing
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      then:
        # Send event to Home Assistant for automation handling
        - homeassistant.event:
            event: esphome.speaker_button_pressed
            data:
              device: ${device_name}
