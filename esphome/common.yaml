# Common configuration for all NFC Party Controller ESP32 devices
# This file contains shared components: WiFi, API, OTA, PN532, and Buzzer

# ESP32 board configuration
esp32:
  board: esp32dev
  framework:
    type: esp-idf

# WiFi configuration from secrets.yaml
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light

  # Enable fallback hotspot for initial setup
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

# Captive portal for easy WiFi configuration
captive_portal:

# Enable logging
logger:
  level: DEBUG

# Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

# I2C bus for PN532 NFC reader
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  id: i2c_bus

# PN532 NFC Reader
pn532_i2c:
  id: pn532_board
  update_interval: 1s
  on_tag:
    then:
      # Send tag UID to Home Assistant for processing
      # HA will map tag IDs to specific actions using native tag management
      - homeassistant.tag_scanned: !lambda 'return x;'
      # Provide audio feedback - quick beep for tag scan
      - rtttl.play: 'scan:d=4,o=5,b=100:16e6'

# Passive buzzer PWM output
# 5V passive buzzer connected to GPIO23 via N-channel MOSFET circuit
# MOSFET: 2N7000 with 1N5819 Schottky flyback diode
# GPIO23 -> 1kΩ resistor -> MOSFET Gate
# MOSFET Source -> GND
# MOSFET Drain -> Buzzer (-) negative
# Buzzer (+) positive -> 5V
# 1N5819 diode across buzzer (cathode to 5V, anode to drain)
output:
  - platform: ledc
    pin: GPIO23
    id: buzzer_output

# RTTTL component for playing tones and melodies
rtttl:
  output: buzzer_output
  id: buzzer_rtttl

# Scripts for success and failure sounds
script:
  # Play a random success sound (1 of 4 options)
  - id: play_success
    then:
      - lambda: |-
          int sound = rand() % 4;
          if (sound == 0) {
            // Level Up - ascending 5-note victory
            id(buzzer_rtttl).play("levelup:d=4,o=5,b=180:16c6,16d6,16e6,16g6,8c7");
          } else if (sound == 1) {
            // Party Horn - festive blast
            id(buzzer_rtttl).play("party:d=4,o=6,b=250:16c,16e,16g,8c7");
          } else if (sound == 2) {
            // Mario - classic victory
            id(buzzer_rtttl).play("mario:d=4,o=5,b=100:16e6,16e6,32p,8e6,16c6,8e6,8g6,8p,8g,8p");
          } else {
            // Fanfare - triumphant
            id(buzzer_rtttl).play("fanfare:d=4,o=5,b=200:8g6,8g6,8g6,2c7");
          }

  # Play failure/error sound
  - id: play_failure
    then:
      - rtttl.play: 'buzz:d=8,o=4,b=120:16a,16a,16a,16a'

  # Play master card sound (admin/reset confirmation)
  - id: play_master
    then:
      - rtttl.play: 'master:d=8,o=5,b=180:1c6'

  # Play master on sound (rising frequency sweep)
  - id: play_master_on
    then:
      - rtttl.play: 'master_on:d=16,o=4,b=240:c,d,e,f,g,a,b,c5,d5,e5,f5,g5'

  # Play master off sound (falling frequency sweep)
  - id: play_master_off
    then:
      - rtttl.play: 'master_off:d=16,o=5,b=240:g,f,e,d,c,b4,a4,g4,f4,e4,d4,c4'

# Buttons to trigger sounds from Home Assistant
# These will appear as button entities that can be pressed from automations
button:
  - platform: template
    name: "Play Success"
    id: button_play_success
    on_press:
      - script.execute: play_success

  - platform: template
    name: "Play Failure"
    id: button_play_failure
    on_press:
      - script.execute: play_failure

  - platform: template
    name: "Play Master"
    id: button_play_master
    on_press:
      - script.execute: play_master

  - platform: template
    name: "Play Master On"
    id: button_play_master_on
    on_press:
      - script.execute: play_master_on

  - platform: template
    name: "Play Master Off"
    id: button_play_master_off
    on_press:
      - script.execute: play_master_off

# Common sensors for both devices
sensor:
  # Volume potentiometer (shared by all devices with volume control)
  - platform: adc
    pin: GPIO34
    name: "Volume Pot"
    id: volume_pot
    attenuation: 12db
    update_interval: 100ms
    filters:
      # Sliding window average for smoothing (larger window to reduce noise)
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
      # Convert to percentage using actual measured voltage range
      - calibrate_linear:
          - 0.142 -> 0.0
          - 3.118 -> 100.0
      - clamp:
          min_value: 0
          max_value: 75
          ignore_out_of_range: true
      # Only send updates when change > 2% (increased to ignore noise)
      - delta: 2.0
    unit_of_measurement: "%"
    accuracy_decimals: 0

