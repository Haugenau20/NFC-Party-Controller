# NFC Party Controller - TEST Configuration
# For testing passive buzzer implementation before deploying to production
# Target: ESP32 #2 hardware

substitutions:
  device_name: nfc-party-controller-test
  friendly_name: "NFC Party Controller TEST"
  device_description: "Test configuration for passive buzzer testing"

esphome:
  name: ${device_name}
  comment: ${device_description}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# WiFi configuration from secrets.yaml
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot for initial setup
  ap:
    ssid: "NFC Test Fallback"
    password: !secret ap_password

# Captive portal for easy WiFi configuration
captive_portal:

# Enable logging
logger:
  level: DEBUG

# Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

# I2C bus for PN532 NFC reader
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  id: i2c_bus

# PN532 NFC Reader
pn532_i2c:
  id: pn532_board
  on_tag:
    then:
      # Send tag UID to Home Assistant for processing
      - homeassistant.tag_scanned: !lambda 'return x;'
      # Play a tone using the passive buzzer
      - rtttl.play: 'beep:d=4,o=5,b=100:16e6'

# Passive buzzer PWM output
# Connect to GPIO23 (or through transistor for 5V buzzer)
output:
  - platform: ledc
    pin: GPIO23
    id: buzzer_output

# RTTTL component for playing tones and melodies
rtttl:
  output: buzzer_output
  id: buzzer_rtttl

# Status LED (using built-in LED for debugging)
status_led:
  pin: GPIO2

# Common sensors
sensor:
  # WiFi signal strength
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  # Uptime sensor
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s

# Text sensors for device info
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
    ssid:
      name: "${friendly_name} Connected SSID"
    mac_address:
      name: "${friendly_name} MAC Address"

  - platform: version
    name: "${friendly_name} ESPHome Version"

# Buttons to test different buzzer sounds from Home Assistant
button:
  # SUCCESS SOUNDS - Upward/happy tones
  - platform: template
    name: "${friendly_name} SUCCESS 1 - Level Up"
    on_press:
      - rtttl.play: 'levelup:d=4,o=5,b=180:16c6,16d6,16e6,16g6,8c7'

  - platform: template
    name: "${friendly_name} SUCCESS 2 - Fanfare"
    on_press:
      - rtttl.play: 'fanfare:d=4,o=5,b=200:8g6,8g6,8g6,2c7'

  - platform: template
    name: "${friendly_name} SUCCESS 3 - Party Horn"
    on_press:
      - rtttl.play: 'party:d=4,o=6,b=250:16c,16e,16g,8c7'

  - platform: template
    name: "${friendly_name} SUCCESS 4 - Cheerful"
    on_press:
      - rtttl.play: 'cheer:d=4,o=6,b=200:8e,8g,8c7,4e7'

  # FAILURE SOUNDS - Downward/sad tones
  - platform: template
    name: "${friendly_name} FAILURE 1 - Wrong"
    on_press:
      - rtttl.play: 'wrong:d=4,o=5,b=100:8g,8f,8e,8d,4c'

  - platform: template
    name: "${friendly_name} FAILURE 2 - Sad Trombone"
    on_press:
      - rtttl.play: 'trombone:d=4,o=5,b=90:8a,8g,8f,2c'

  - platform: template
    name: "${friendly_name} FAILURE 3 - Buzz"
    on_press:
      - rtttl.play: 'buzz:d=8,o=4,b=120:16a,16a,16a,16a'

  - platform: template
    name: "${friendly_name} FAILURE 4 - Denied"
    on_press:
      - rtttl.play: 'denied:d=4,o=5,b=140:8e,8e,8p,8e,8e'

  # UTILITY SOUNDS
  - platform: template
    name: "${friendly_name} UTIL - Quick Beep"
    on_press:
      - rtttl.play: 'beep:d=4,o=5,b=100:16e6'

  - platform: template
    name: "${friendly_name} UTIL - Mario (fun test)"
    on_press:
      - rtttl.play: 'mario:d=4,o=5,b=100:16e6,16e6,32p,8e6,16c6,8e6,8g6,8p,8g,8p'
