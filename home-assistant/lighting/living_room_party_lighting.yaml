# Living Room Party Lighting - Automated Time-Based Hue Scenes
#
# REQUIRED HUE SCENES - Create these in Philips Hue app (Living Room):
#
# 1. scene.living_room_arrival
#    Phase: 5:00 PM - 6:30 PM
#    Vibe: Warm and welcoming with colorful accents (not wild)
#    Colors: Light coral, warm amber, soft peach, warm white
#
# 2. scene.living_room_dinner
#    Phase: 6:30 PM - 8:00 PM
#    Vibe: Cozy, warm, dinner-focused
#    Colors: Dimmed warm amber, functional bright white for eating
#
# 3. scene.living_room_post_dinner
#    Phase: 8:00 PM - 10:00 PM
#    Vibe: Energy building, transition to party mode
#    Colors: Warm amber/orange gradient
#
# 4. scene.living_room_prime_time
#    Phase: 10:00 PM - 11:30 PM
#    Vibe: Energetic, saturated, peak party mode
#    Colors: Deep purple/magenta, bold and dramatic
#
# 5. scene.living_room_countdown_prep
#    Phase: 11:30 PM - 11:59 PM
#    Vibe: Building anticipation for midnight
#    Colors: Goldenrod, gold (will transition to countdown)
#
# 6. scene.living_room_after_party
#    Phase: 12:01 AM onwards
#    Vibe: Celebratory but sustainable
#    Colors: Bright gold/champagne, light yellow
#
# LIVING ROOM LIGHTS:
# - light.hue_signe → Signe floor lamp (color capable)
# - light.up → Ensis Up light (ambient ceiling wash)
# - light.down → Ensis Down light (functional task lighting)
# - light.sengelampe_op → Beyond Up light (ambient table lamp)
# - light.sengelampe_ned → Beyond Down light (table task lighting)
#
# DESIGN PHILOSOPHY:
# - Time-based automation only (no manual overrides)
# - Scenes created in Hue app for fast iteration
# - Slower color transitions than kitchen (background vs feature)
# - Down lights can be manually adjusted via Hue remote without affecting scene colors
# - Midnight countdown is hardcoded sequence (not a scene) for precise timing

# ============================================================================
# TIME-BASED AUTOMATIONS - Automatic scene transitions
# ============================================================================

automation:
  # Automatic transition to Arrival at 5:00 PM
  - alias: "Living Room - Auto Arrival (5pm)"
    description: "Automatically sets living room to Arrival scene at 5:00 PM"

    trigger:
      - platform: time
        at: "17:00:00"

    action:
      - service: scene.turn_on
        target:
          entity_id: scene.living_room_arrival

    mode: single

  # Automatic transition to Dinner at 6:30 PM
  - alias: "Living Room - Auto Dinner (6:30pm)"
    description: "Automatically sets living room to Dinner scene at 6:30 PM"

    trigger:
      - platform: time
        at: "18:30:00"

    action:
      - service: scene.turn_on
        target:
          entity_id: scene.living_room_dinner

    mode: single

  # Automatic transition to Post-Dinner at 8:00 PM
  - alias: "Living Room - Auto Post-Dinner (8pm)"
    description: "Automatically sets living room to Post-Dinner scene at 8:00 PM"

    trigger:
      - platform: time
        at: "20:00:00"

    action:
      - service: scene.turn_on
        target:
          entity_id: scene.living_room_post_dinner

    mode: single

  # Automatic transition to Prime Time at 10:00 PM
  - alias: "Living Room - Auto Prime Time (10pm)"
    description: "Automatically sets living room to Prime Time scene at 10:00 PM"

    trigger:
      - platform: time
        at: "22:00:00"

    action:
      - service: scene.turn_on
        target:
          entity_id: scene.living_room_prime_time

    mode: single

  # Automatic transition to Countdown Prep at 11:30 PM
  - alias: "Living Room - Auto Countdown Prep (11:30pm)"
    description: "Automatically sets living room to Countdown Prep scene at 11:30 PM"

    trigger:
      - platform: time
        at: "23:30:00"

    action:
      - service: scene.turn_on
        target:
          entity_id: scene.living_room_countdown_prep

    mode: single

  # Automatic midnight countdown sequence at 11:59 PM
  - alias: "Living Room - Auto Midnight Countdown (11:59pm)"
    description: "Automatically triggers the 60-second countdown sequence at 11:59 PM"

    trigger:
      - platform: time
        at: "23:59:00"

    action:
      - service: script.living_room_midnight_countdown

    mode: single

  # Automatic transition to After Party at 12:01 AM
  - alias: "Living Room - Auto After Party (12:01am)"
    description: "Automatically sets living room to After Party scene at 12:01 AM"

    trigger:
      - platform: time
        at: "00:01:00"

    action:
      - service: scene.turn_on
        target:
          entity_id: scene.living_room_after_party

    mode: single
