alias: "Admin - Pause/Play All Speakers (SpotifyPlus)"
description: "Admin-only: Pauses or plays all speakers based on their current states"

trigger:
  - platform: event
    event_type: tag_scanned
    event_data:
      tag_id: "04-CA-F5-AE-7A-26-81"  

action:
  # Play master sound
  - delay:
      milliseconds: 300
  - service: button.press
    target:
      entity_id: button.nfc_party_controller_1_play_master

  # Wait for master sound to finish (roughly)
  - delay:
      milliseconds: 2000

  - choose:
      # Case 1: If EITHER speaker is playing → Pause BOTH
      - conditions:
          - or:
              - condition: state
                entity_id: media_player.spotifyplus_soren_kjaedegaard_haug
                state: 'playing'
              - condition: state
                entity_id: media_player.spotifyplus_soren_nytar
                state: 'playing'
        sequence:
          - service: media_player.media_pause
            target:
              entity_id:
                - media_player.spotifyplus_soren_kjaedegaard_haug
                - media_player.spotifyplus_soren_nytar

      # Case 2: Both are paused → Play both
      - conditions:
          - condition: state
            entity_id: media_player.spotifyplus_soren_kjaedegaard_haug
            state: 'paused'
          - condition: state
            entity_id: media_player.spotifyplus_soren_nytar
            state: 'paused'
        sequence:
          # Transfer Device 1 to correct speaker and resume
          - service: spotifyplus.player_transfer_playback
            data:
              entity_id: media_player.spotifyplus_soren_kjaedegaard_haug
              device_id: "0878ad3f043dc6651edf83f71a7949a6318a3fbe"
              play: true

          # Transfer Device 2 to correct speaker and resume
          - service: spotifyplus.player_transfer_playback
            data:
              entity_id: media_player.spotifyplus_soren_nytar
              device_id: "bf5a8c6dec19164ebccafb965417175d8bd3e17a"
              play: true

      # Case 3: Both are idle → Start both with base playlists
      - conditions:
          - condition: template
            value_template: "{{ not is_state('media_player.spotifyplus_soren_kjaedegaard_haug', 'playing') and not is_state('media_player.spotifyplus_soren_kjaedegaard_haug', 'paused') }}"
          - condition: template
            value_template: "{{ not is_state('media_player.spotifyplus_soren_nytar', 'playing') and not is_state('media_player.spotifyplus_soren_nytar', 'paused') }}"
        sequence:
          # Start Device 1 (Living room) - play playlist on specific device
          - service: spotifyplus.player_media_play_context
            data:
              entity_id: media_player.spotifyplus_soren_kjaedegaard_haug
              context_uri: "{{ states('input_text.base_playlist_uri') }}"
              device_id: "0878ad3f043dc6651edf83f71a7949a6318a3fbe"

          # Start Device 2 (Kitchen) - play playlist on specific device
          - service: spotifyplus.player_media_play_context
            data:
              entity_id: media_player.spotifyplus_soren_nytar
              context_uri: "{{ states('input_text.device_2_base_playlist_uri') }}"
              device_id: "bf5a8c6dec19164ebccafb965417175d8bd3e17a"

    # Default: Mixed states (one idle, one paused, or other combinations)
    default:
      # Handle Device 1 based on its state
      - choose:
          # Device 1 is idle → Start it with base playlist
          - conditions:
              - condition: template
                value_template: "{{ not is_state('media_player.spotifyplus_soren_kjaedegaard_haug', 'playing') and not is_state('media_player.spotifyplus_soren_kjaedegaard_haug', 'paused') }}"
            sequence:
              - service: spotifyplus.player_media_play_context
                data:
                  entity_id: media_player.spotifyplus_soren_kjaedegaard_haug
                  context_uri: "{{ states('input_text.base_playlist_uri') }}"
                  device_id: "0878ad3f043dc6651edf83f71a7949a6318a3fbe"

          # Device 1 is paused → Resume it
          - conditions:
              - condition: state
                entity_id: media_player.spotifyplus_soren_kjaedegaard_haug
                state: 'paused'
            sequence:
              - service: spotifyplus.player_transfer_playback
                data:
                  entity_id: media_player.spotifyplus_soren_kjaedegaard_haug
                  device_id: "0878ad3f043dc6651edf83f71a7949a6318a3fbe"
                  play: true

      # Handle Device 2 based on its state
      - choose:
          # Device 2 is idle → Start it with base playlist
          - conditions:
              - condition: template
                value_template: "{{ not is_state('media_player.spotifyplus_soren_nytar', 'playing') and not is_state('media_player.spotifyplus_soren_nytar', 'paused') }}"
            sequence:
              - service: spotifyplus.player_media_play_context
                data:
                  entity_id: media_player.spotifyplus_soren_nytar
                  context_uri: "{{ states('input_text.device_2_base_playlist_uri') }}"
                  device_id: "bf5a8c6dec19164ebccafb965417175d8bd3e17a"

          # Device 2 is paused → Resume it
          - conditions:
              - condition: state
                entity_id: media_player.spotifyplus_soren_nytar
                state: 'paused'
            sequence:
              - service: spotifyplus.player_transfer_playback
                data:
                  entity_id: media_player.spotifyplus_soren_nytar
                  device_id: "bf5a8c6dec19164ebccafb965417175d8bd3e17a"
                  play: true

mode: single  # Prevent simultaneous executions
