          transition: 2

      ## - service: light.turn_on
      ##   target:
      ##     entity_id: light.PLACEHOLDER_KITCHEN_LIGHTSTRIP_EXTRA
      ##   data:
      ##     brightness: 200
      ##     rgb_color: [255, 0, 144]
      ##     transition: 2

  # Energetic Category - Vibrant Orange
