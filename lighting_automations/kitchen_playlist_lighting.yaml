# Kitchen Playlist-Based Lighting - Category Color System
#
# PLACEHOLDERS TO REPLACE:
# - light.PLACEHOLDER_KITCHEN_AURELLE → Your Hue Aurelle 60x60cm entity ID (white ambiance only)
# - light.PLACEHOLDER_KITCHEN_LIGHTSTRIP → Your Hue lightstrip entity ID (color capable)
# - light.PLACEHOLDER_KITCHEN_LIGHTSTRIP_EXTRA → Your extra 2m lightstrip entity ID (OPTIONAL - see note below)
# - PLACEHOLDER_TAG_[PLAYLIST] → Replace with actual NFC tag UIDs for each playlist
# - button.nfc_party_controller_2_play_success → Device 2 success sound (already exists)
#
# NOTE ON EXTRA LIGHTSTRIP:
# The extra 2m lightstrip code is COMMENTED OUT by default (see lines marked with ##).
# Once you install it and know the entity ID:
# 1. Replace light.PLACEHOLDER_KITCHEN_LIGHTSTRIP_EXTRA with actual entity ID
# 2. Uncomment all lines that start with ##
# 3. Restart Home Assistant
#
# DESIGN PHILOSOPHY:
# - Aurelle (ceiling panel): White ambiance only - brightness/temperature varies by category
# - Lightstrip: Full RGB colors - rotates through category-specific palettes
# - Categories: Energetic (bright/saturated) vs Chill (calm/cool)

# ============================================================================
# SCRIPTS - Color Palettes for Each Category
# ============================================================================

script:
  # Energetic Category - Electric Blue
  kitchen_energetic_electric_blue:
    alias: "Kitchen Energetic - Electric Blue"
    sequence:
      # Aurelle: Cool white, high brightness (no color capability)
      - service: light.turn_on
        target:
          entity_id: light.PLACEHOLDER_KITCHEN_AURELLE
        data:
          brightness: 220  # 86% brightness
          color_temp: 250  # Cool white
          transition: 2

      # Main Lightstrip: Electric Blue
      - service: light.turn_on
        target:
          entity_id: light.PLACEHOLDER_KITCHEN_LIGHTSTRIP
        data:
          brightness: 200  # 78% brightness
          rgb_color: [0, 191, 255]  # Electric Blue
          transition: 2

      # Extra 2m Lightstrip: Electric Blue (COMMENTED OUT - uncomment when installed)
      ## - service: light.turn_on
      ##   target:
      ##     entity_id: light.PLACEHOLDER_KITCHEN_LIGHTSTRIP_EXTRA
      ##   data:
      ##     brightness: 200
      ##     rgb_color: [0, 191, 255]
      ##     transition: 2

