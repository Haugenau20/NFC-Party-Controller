# ============================================================================
# AUTOMATION - Playlist NFC Scans Control Kitchen Lights
# ============================================================================

automation:
  - alias: "Kitchen - Playlist-Based Lighting Control"
    description: "Changes kitchen lights based on which playlist NFC card is scanned on Device 2"

    trigger:
      - platform: event
        event_type: tag_scanned

    condition:
      # Only trigger on Device 2 (Kitchen)
      - condition: template
        value_template: "{{ trigger.event.data.device_id == 'c2c429cbccd32c459c05662a24505349' }}"

    action:
      - choose:
          # ==================== ENERGETIC CATEGORY ====================
          # Color rotates: Electric Blue → Hot Magenta → Vibrant Orange → Lime Green → Purple

          # 80s
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.tag_id == 'PLACEHOLDER_TAG_80S' }}"
            sequence:
              - service: "script.kitchen_energetic_{{ states('input_select.kitchen_energetic_color_rotation') | lower | replace(' ', '_') }}"
              - service: input_select.select_next
                target:
                  entity_id: input_select.kitchen_energetic_color_rotation
                data:
                  cycle: true

          # 90s
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.tag_id == 'PLACEHOLDER_TAG_90S' }}"
            sequence:
              - service: "script.kitchen_energetic_{{ states('input_select.kitchen_energetic_color_rotation') | lower | replace(' ', '_') }}"
              - service: input_select.select_next
                target:
                  entity_id: input_select.kitchen_energetic_color_rotation
                data:
                  cycle: true

