# Kitchen Playlist-Based Lighting - Scene/Static Mode System
#
# REQUIRED HELPERS - Create these in Home Assistant UI (Settings → Helpers):
#
# 1. Boolean Toggle:
#    input_boolean.enable_scenes_device_2
#      Name: "Enable Scenes on Device 2"
#      Default: true
#      Icon: mdi:palette (optional)
#      tag id: 04-75-E8-AE-7A-26-81
#
# 2. Energetic Scene Rotation:
#    input_select.kitchen_energetic_scene_rotation
#      Name: "Kitchen Energetic Scene Rotation"
#      Options:
#        - PLACEHOLDER_SCENE_ENERGETIC_1
#        - PLACEHOLDER_SCENE_ENERGETIC_2
#        - PLACEHOLDER_SCENE_ENERGETIC_3
#        - PLACEHOLDER_SCENE_ENERGETIC_4
#        - PLACEHOLDER_SCENE_ENERGETIC_5
#
# 3. Chill Scene Rotation:
#    input_select.kitchen_chill_scene_rotation
#      Name: "Kitchen Chill Scene Rotation"
#      Options:
#        - PLACEHOLDER_SCENE_CHILL_1
#        - PLACEHOLDER_SCENE_CHILL_2
#        - PLACEHOLDER_SCENE_CHILL_3
#        - PLACEHOLDER_SCENE_CHILL_4
#
# PLACEHOLDERS TO REPLACE:
# - PLACEHOLDER_SCENE_ENERGETIC_1-5 → Your Hue scene entity IDs (e.g., scene.kitchen_soho)
# - PLACEHOLDER_SCENE_CHILL_1-4 → Your Hue chill scene entity IDs
# - PLACEHOLDER_TAG_[PLAYLIST] → Replace with actual NFC tag UIDs for each playlist
# - button.nfc_party_controller_2_play_success → Device 2 success sound (already exists)
#
# KITCHEN LIGHTS:
# - light.kokken → Aurelle 60x60cm ceiling panel (white ambiance only)
# - light.hue_lightstrip_plus_1 → Main lightstrip (color capable)
# - light.kokken_top → Extra 2m lightstrip (color capable)
#
# DESIGN PHILOSOPHY:
# - Scene Mode (default): Dynamic Hue scenes that cycle colors automatically
# - Static Mode (toggle): Static colors with rotation on each playlist scan
# - Aurelle (ceiling panel): White ambiance only - brightness/temperature varies
# - Lightstrips: Full RGB colors - match scenes or static palette
# - Categories: Energetic (bright/saturated) vs Chill (calm/cool)

# ============================================================================
# SCRIPTS - Static Color Palettes (Used when Scene Mode is OFF)
# ============================================================================

script:
  # Energetic Category - Electric Blue
  kitchen_energetic_electric_blue:
    alias: "Kitchen Energetic - Electric Blue"
    sequence:
      # Aurelle: Cool white, high brightness (no color capability)
      - service: light.turn_on
        target:
          entity_id: light.kokken
        data:
          brightness: 220  # 86% brightness
          color_temp: 250  # Cool white
          transition: 2

      # Main Lightstrip: Electric Blue
      - service: light.turn_on
        target:
          entity_id: light.hue_lightstrip_plus_1
        data:
          brightness: 200  # 78% brightness
          rgb_color: [0, 191, 255]  # Electric Blue
          transition: 2

      # Extra 2m Lightstrip: Electric Blue
      - service: light.turn_on
        target:
          entity_id: light.kokken_top
        data:
          brightness: 200
          rgb_color: [0, 191, 255]
