# ============================================================================
# AUTOMATION - Playlist NFC Scans Control Kitchen Lights
# ============================================================================

automation:
  - alias: "Kitchen - Playlist-Based Lighting Control"
    description: "Changes kitchen lights based on playlist category - Scene or Static mode"

    trigger:
      - platform: event
        event_type: tag_scanned

    condition:
      # Only trigger on Device 2 (Kitchen)
      - condition: template
        value_template: "{{ trigger.event.data.device_id == 'c2c429cbccd32c459c05662a24505349' }}"

    action:
      - choose:
          # ==================== ENERGETIC CATEGORY ====================

          # 80s
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.tag_id == '04-7B-75-AE-7A-26-81' }}"
            sequence:
              - choose:
                  # Scene Mode
                  - conditions:
                      - condition: state
                        entity_id: input_boolean.enable_scenes_device_2
                        state: "on"
                    sequence:
                      - service: scene.turn_on
                        target:
                          entity_id: "{{ states('input_select.kitchen_energetic_scene_rotation') }}"
                      - service: input_select.select_next
                        target:
                          entity_id: input_select.kitchen_energetic_scene_rotation
                        data:
                          cycle: true
                # Static Mode
                default:
                  - service: "script.kitchen_energetic_{{ states('input_select.kitchen_energetic_color_rotation') | lower | replace(' ', '_') }}"
                  - service: input_select.select_next
                    target:
                      entity_id: input_select.kitchen_energetic_color_rotation
                    data:
                      cycle: true

          # 90s
